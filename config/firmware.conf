# ==============================================================================
# Jellybean-37 Firmware Build Configuration
# ==============================================================================
# Edit this file to customize your build options before running ninja.
# Ninja automatically detects changes to this file and reconfigures the build.
# ==============================================================================

# Core CPU Frequency in MHz
# Options:
#   320 - Standard clock frequency (safe, lower power)
#   360 - Factory overclock (maximum DSP & polyphony headroom)
CPU_FREQ_MHZ = 360

# Audio Engine Sample Rate in Hz
# Options:
#   48000 - Standard 48 kHz I2S DAC output (CS4344)
AUDIO_SAMPLE_RATE = 48000

# Visual Startup Diagnostics & Hardware Self-Test on Boot
# Options:
#   OFF - Fast boot: skip diagnostic screen, self-test, and microbenchmarks.
#         Excludes diag/bench/selftest code from binary and saves flash space.
#   ON  - Show 16x16 visual progress grid on ST7789 LCD, run hardware driver
#         self-tests, and run pi32v2 FP microbenchmarks.
STARTUP_DIAGNOSTICS = OFF

# USB CDC-ACM Virtual COM Port / Serial TTY
# Options:
#   OFF - Exclude USB serial driver and CDC descriptors from firmware.
#         Device enumerates strictly as USB Audio + USB MIDI. Saves ~3KB SRAM.
#   ON  - Enable USB serial ACM interface for debugging, CLI, and telemetry.
ENABLE_SERIAL = OFF

# Sustained Audio Stress Benchmark Mode
# Options:
#   OFF - Normal synth firmware operation
#   ON  - Run continuous 6-voice MCUno stress test and stream telemetry over USB CDC
BENCH_MODE = OFF

# Keybed Matrix Scan Frequency in Hz
# Options:
#   2000 - Standard 2 kHz matrix scan (~500 us per completed 16-row frame)
#   3000 - High-speed 3 kHz matrix scan (~333 us)
#   4000 - Fast 4 kHz matrix scan (~250 us)
#   5000 - Ultra-fast 5 kHz matrix scan (~200 us)
KEYBED_SCAN_FREQ_HZ = 2000

